[project]
name = "enterprise-ai-knowledge-assistant"
version = "0.1.0"
description = "Built a production-ready Enterprise AI Knowledge Assistant using Retrieval-Augmented Generation (RAG)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu==1.10.0",
    "numpy>=2.5.4",
    "openai>=3.31.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[dependency-groups]
dev = [
    "setuptools>=83.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
